---
# OpenLDAP + Keycloak on red-identity-1 as system Podman containers managed by
# systemd Quadlet. Secrets come from Vault KV (identity_secrets on localhost)
# and reach the containers only as Podman secrets.

- name: Bind the identity secrets from the controller (in memory)
  ansible.builtin.set_fact:
    idstack: "{{ hostvars['localhost'].identity_secrets }}"
  no_log: true

- name: Install Podman and the LDAP client libraries
  ansible.builtin.dnf:
    name: [podman, python3-ldap, openldap-clients]
    state: present

- name: Create the configuration directories
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
    owner: "{{ item.owner | default('root') }}"
    group: root
    mode: "{{ item.mode }}"
  loop:
    - { path: "{{ identity_conf_dir }}", mode: "0755" }
    - { path: "{{ identity_conf_dir }}/tls", mode: "0755" }
    - { path: "{{ identity_conf_dir }}/tls/keycloak", mode: "0755" }
    - { path: "{{ identity_conf_dir }}/tls/ldap", mode: "0755" }
    - { path: /etc/containers/systemd, mode: "0755" }

# ── TLS from the lab CA ──────────────────────────────────────────────────────
- name: Issue the identity certificate
  ansible.builtin.include_role:
    name: vault_tls
    tasks_from: issue.yml

- name: Trust the lab CA on the node
  ansible.builtin.include_role:
    name: vault_tls
    tasks_from: anchor.yml

- name: Install the public certificates
  ansible.builtin.copy:
    src: "{{ tls_dir }}/{{ item.src }}"
    dest: "{{ identity_conf_dir }}/tls/{{ item.dest }}"
    mode: "0644"
  loop:
    - { src: "{{ inventory_hostname }}.crt", dest: keycloak/server.crt, notify: keycloak }
    - { src: "{{ inventory_hostname }}.crt", dest: ldap/server.crt, notify: openldap }
    - { src: ca.crt, dest: ldap/ca.crt, notify: openldap }
  loop_control:
    label: "{{ item.dest }}"
  register: idstack_certs

# Keycloak runs as uid 1000 in the container (rootful Podman, no userns).
- name: Install the Keycloak private key (contents suppressed)
  ansible.builtin.copy:
    src: "{{ tls_dir }}/{{ inventory_hostname }}.key"
    dest: "{{ identity_conf_dir }}/tls/keycloak/server.key"
    owner: "1000"
    mode: "0400"
  no_log: true
  diff: false
  register: idstack_kc_key

- name: Install the OpenLDAP private key (contents suppressed)
  ansible.builtin.copy:
    src: "{{ tls_dir }}/{{ inventory_hostname }}.key"
    dest: "{{ identity_conf_dir }}/tls/ldap/server.key"
    mode: "0600"
  no_log: true
  diff: false
  register: idstack_ldap_key

# ── Podman secrets ───────────────────────────────────────────────────────────
- name: Create the Podman secrets (contents suppressed)
  containers.podman.podman_secret:
    name: "{{ item.name }}"
    data: "{{ idstack[item.key] }}"
    state: present
    force: false
    skip_existing: true
  loop:
    - { name: ldap-admin-password, key: ldap_admin_password }
    - { name: ldap-readonly-password, key: ldap_readonly_password }
    - { name: keycloak-admin-password, key: keycloak_admin_password }
  loop_control:
    label: "{{ item.name }}"
  no_log: true

# ── Quadlet units ────────────────────────────────────────────────────────────
- name: Remove the bridge network (host networking now)
  ansible.builtin.file:
    path: /etc/containers/systemd/red-identity.network
    state: absent
  register: idstack_old_net

- name: Install the Quadlet containers
  ansible.builtin.template:
    src: "{{ item }}.j2"
    dest: "/etc/containers/systemd/{{ item }}"
    mode: "0644"
  loop: [openldap.container, keycloak.container]
  register: idstack_units

- name: Regenerate units after Quadlet changes
  ansible.builtin.systemd_service:
    daemon_reload: true
  when: idstack_units is changed or idstack_old_net is changed

- name: Restart OpenLDAP when its unit or TLS changed
  ansible.builtin.systemd_service:
    name: openldap
    state: restarted
  when: >-
    (idstack_units.results | selectattr('item', 'equalto', 'openldap.container') | first) is changed
    or idstack_ldap_key is changed
    or (idstack_certs.results | selectattr('item.notify', 'equalto', 'openldap') | selectattr('changed') | list | length > 0)

- name: Restart Keycloak when its unit or TLS changed
  ansible.builtin.systemd_service:
    name: keycloak
    state: restarted
  when: >-
    (idstack_units.results | selectattr('item', 'equalto', 'keycloak.container') | first) is changed
    or idstack_kc_key is changed
    or (idstack_certs.results | selectattr('item.notify', 'equalto', 'keycloak') | selectattr('changed') | list | length > 0)

- name: Start the identity services
  ansible.builtin.systemd_service:
    name: "{{ item }}"
    state: started
  loop: [openldap, keycloak]

# LDAPS only for the Vault cluster; Keycloak only for the front door once it
# exists (everyone reaches Keycloak through the proxy then).
- name: Open LDAPS to the Vault cluster
  ansible.builtin.include_tasks: "{{ playbook_dir }}/tasks/firewall-port.yml"
  vars:
    fw_port: "{{ ldaps_port }}"
    fw_sources: "{{ groups['vault'] | map('extract', hostvars, 'ansible_host') | list }}"

- name: Open Keycloak HTTPS (front door only, when present)
  ansible.builtin.include_tasks: "{{ playbook_dir }}/tasks/firewall-port.yml"
  vars:
    fw_port: "{{ keycloak_port }}"
    fw_sources: "{{ [hostvars[proxy_node].ansible_host] if front_door | bool else [] }}"

# Anonymous reads of the base are denied by ACL (answered as "No such
# object"); the root DSE is public and lists the naming context.
- name: Wait for the directory
  ansible.builtin.command:
    argv: [ldapsearch, -x, -LLL, -H, "ldap://127.0.0.1:389", -b, "", -s, base, namingContexts]
  register: idstack_ldap_up
  changed_when: false
  check_mode: false
  retries: 30
  delay: 3
  until: idstack_ldap_up.rc == 0 and identity_base_dn in idstack_ldap_up.stdout

- name: Wait for Keycloak to be ready
  ansible.builtin.uri:
    url: "https://127.0.0.1:{{ keycloak_mgmt_port }}/health/ready"
  register: idstack_kc_ready
  check_mode: false
  retries: 60
  delay: 5
  until: idstack_kc_ready.status == 200

# Keycloak is configured through its public URL (the front door, once it
# exists); wait until that path serves the realm-independent discovery.
- name: Wait for Keycloak at its public URL
  ansible.builtin.uri:
    url: "{{ keycloak_public_url }}/realms/master/.well-known/openid-configuration"
  register: idstack_kc_public
  check_mode: false
  retries: 30
  delay: 3
  until: idstack_kc_public.status == 200

- name: Load the directory content
  ansible.builtin.include_tasks: directory.yml

- name: Configure the Keycloak realm
  ansible.builtin.include_tasks: keycloak.yml
