---
# Prove people work end to end. Produces `identity_report` (list of
# {id,label,status,detail}) for validate.yml. Tokens are revoked at the end.
# Runs on localhost; needs identity_secrets (identity_secrets role).

- name: Address Keycloak and Vault
  ansible.builtin.set_fact:
    ivf_vault: "https://{{ hostvars[vault_leader].ansible_host }}:{{ vault_api_port }}"
    ivf_token_url: "{{ keycloak_issuer }}/protocol/openid-connect/token"
    identity_report: []

- name: Exercise every person
  no_log: true
  block:
    - name: Keycloak password grant (red-pass-cli) per person
      ansible.builtin.uri:
        url: "{{ ivf_token_url }}"
        method: POST
        ca_path: "{{ vault_ca_cert }}"
        body_format: form-urlencoded
        body:
          grant_type: password
          client_id: red-pass-cli
          scope: openid
          username: "{{ item.uid }}"
          password: "{{ identity_secrets['user_' ~ item.uid] }}"
        status_code: [200, 400, 401]
      check_mode: false
      loop: "{{ identity_users }}"
      register: ivf_kc

    - name: Vault JWT login with each Keycloak id_token
      ansible.builtin.uri:
        url: "{{ ivf_vault }}/v1/auth/jwt/login"
        method: POST
        ca_path: "{{ vault_ca_cert }}"
        body_format: json
        body: { role: cli, jwt: "{{ item.json.id_token | default('') }}" }
        status_code: [200, 400, 403]
      check_mode: false
      loop: "{{ ivf_kc.results }}"
      register: ivf_oidc

    - name: Vault LDAP login per person
      ansible.builtin.uri:
        url: "{{ ivf_vault }}/v1/auth/ldap/login/{{ item.uid }}"
        method: POST
        ca_path: "{{ vault_ca_cert }}"
        body_format: json
        body: { password: "{{ identity_secrets['user_' ~ item.uid] }}" }
        status_code: [200, 400, 403]
      check_mode: false
      loop: "{{ identity_users }}"
      register: ivf_ldap

    - name: Index tokens by person (memory only)
      ansible.builtin.set_fact:
        ivf_tok: >-
          {{ ivf_tok | default({}) | combine({item.0.uid: {
               'oidc': item.1.json.auth.client_token | default(''),
               'ldap': item.2.json.auth.client_token | default('') }}) }}
      loop: "{{ identity_users | zip(ivf_oidc.results, ivf_ldap.results) | list }}"

    # Effective identity policies are authoritative on the token itself (the
    # JWT login response leaves identity_policies empty).
    - name: Look up every person's tokens
      ansible.builtin.uri:
        url: "{{ ivf_vault }}/v1/auth/token/lookup-self"
        ca_path: "{{ vault_ca_cert }}"
        headers: { X-Vault-Token: "{{ ivf_tok[item.0.uid][item.1] }}" }
        status_code: [200, 400, 403]
      check_mode: false
      loop: "{{ identity_users | product(['oidc', 'ldap']) | list }}"
      register: ivf_lookup

    - name: Index effective identity policies (names only)
      ansible.builtin.set_fact:
        ivf_policies: >-
          {{ ivf_policies | default({}) | combine({item.item.0.uid ~ '/' ~ item.item.1:
               (item.json.data.identity_policies | default([], true)) if item.status == 200 else []}) }}
      loop: "{{ ivf_lookup.results }}"

    - name: Admin ensures the demo Transit key in engineering
      ansible.builtin.uri:
        url: "{{ ivf_vault }}/v1/transit/keys/red-pass-demo"
        method: POST
        ca_path: "{{ vault_ca_cert }}"
        headers: { X-Vault-Token: "{{ ivf_tok[ivf_admin].ldap }}", X-Vault-Namespace: engineering }
        status_code: [200, 204]
      check_mode: false
      changed_when: false
      vars:
        ivf_admin: "{{ (identity_users | selectattr('group', 'equalto', 'red-pass-admins') | first).uid }}"

    - name: Operator encrypts with Transit
      ansible.builtin.uri:
        url: "{{ ivf_vault }}/v1/transit/encrypt/red-pass-demo"
        method: POST
        ca_path: "{{ vault_ca_cert }}"
        headers: { X-Vault-Token: "{{ ivf_tok[ivf_operator].oidc }}", X-Vault-Namespace: engineering }
        body_format: json
        body: { plaintext: "{{ 'red_pass identity check' | b64encode }}" }
        status_code: [200, 403]
      check_mode: false
      register: ivf_encrypt
      vars:
        ivf_operator: "{{ (identity_users | selectattr('group', 'equalto', 'red-pass-operators') | first).uid }}"

    - name: Viewer tries to write KV (must be denied)
      ansible.builtin.uri:
        url: "{{ ivf_vault }}/v1/kv/data/red-pass-identity-check"
        method: POST
        ca_path: "{{ vault_ca_cert }}"
        headers: { X-Vault-Token: "{{ ivf_tok[ivf_viewer].oidc }}", X-Vault-Namespace: engineering }
        body_format: json
        body: { data: { probe: denied } }
        status_code: [200, 204, 403]
      check_mode: false
      register: ivf_viewer_write
      vars:
        ivf_viewer: "{{ (identity_users | selectattr('group', 'equalto', 'red-pass-viewers') | first).uid }}"

    - name: Revoke every token issued for the checks
      ansible.builtin.uri:
        url: "{{ ivf_vault }}/v1/auth/token/revoke-self"
        method: POST
        ca_path: "{{ vault_ca_cert }}"
        headers: { X-Vault-Token: "{{ item }}" }
        status_code: [200, 204, 403]
      check_mode: false
      changed_when: false
      loop: "{{ ivf_tok.values() | map('dict2items') | flatten | map(attribute='value') | select | list }}"

    - name: Build the identity report (no tokens, no passwords)
      ansible.builtin.set_fact:
        identity_report: >-
          {{ identity_report + [
               {'id': 'kc-' ~ u.uid, 'label': 'Keycloak login · ' ~ u.uid,
                'status': 'pass' if kc.status == 200 and (kc.json.id_token | default('')) | length > 0 else 'fail',
                'detail': 'id_token issued by ' ~ keycloak_issuer if kc.status == 200 else 'HTTP ' ~ kc.status},
               {'id': 'jwt-' ~ u.uid, 'label': 'Vault JWT login (Keycloak token) · ' ~ u.uid,
                'status': 'pass' if oi.status == 200 and ivf_policies[u.uid ~ '/oidc'] == [identity_groups[u.group].policy] else 'fail',
                'detail': ('identity policies ' ~ (ivf_policies[u.uid ~ '/oidc'] | join(','))) if oi.status == 200 else 'HTTP ' ~ oi.status},
               {'id': 'ldap-' ~ u.uid, 'label': 'Vault LDAP login · ' ~ u.uid,
                'status': 'pass' if ld.status == 200 and ivf_policies[u.uid ~ '/ldap'] == [identity_groups[u.group].policy] else 'fail',
                'detail': ('identity policies ' ~ (ivf_policies[u.uid ~ '/ldap'] | join(','))) if ld.status == 200 else 'HTTP ' ~ ld.status}] }}
      loop: "{{ identity_users | zip(ivf_kc.results, ivf_oidc.results, ivf_ldap.results) | list }}"
      vars:
        u: "{{ item.0 }}"
        kc: "{{ item.1 }}"
        oi: "{{ item.2 }}"
        ld: "{{ item.3 }}"

- name: Add the authorisation checks
  ansible.builtin.set_fact:
    identity_report: >-
      {{ identity_report + [
           {'id': 'operator-encrypt', 'label': 'Operator can encrypt (engineering Transit)',
            'status': 'pass' if ivf_encrypt.status == 200 else 'fail', 'detail': 'HTTP ' ~ ivf_encrypt.status},
           {'id': 'viewer-denied', 'label': 'Viewer is denied a KV write',
            'status': 'pass' if ivf_viewer_write.status == 403 else 'fail', 'detail': 'HTTP ' ~ ivf_viewer_write.status}] }}
