---
# Build the in-memory inventory from live Multipass state. Only allow-listed
# names are ever added: red-vault-1..3 -> group vault, red-vault-s ->
# group vault_seal, all four -> group red_pass.

- name: Read the Multipass inventory
  ansible.builtin.command:
    argv: [multipass, list, --format, json]
  register: inv_list
  changed_when: false
  check_mode: false
  # Tolerate a node that is mid-restart: wait briefly for all four.
  until: >-
    allow_partial | default(false) | bool or
    ((inv_list.stdout | from_json).list | selectattr('name', 'in', lab_nodes)
     | selectattr('state', 'equalto', 'Running') | selectattr('ipv4', 'truthy') | list | length)
    == lab_nodes | length
  retries: 24
  delay: 5
  failed_when: false

- name: Select running allow-listed instances with an IPv4 address
  ansible.builtin.set_fact:
    inv_nodes: >-
      {{ (inv_list.stdout | from_json).list
         | selectattr('name', 'in', lab_nodes)
         | selectattr('state', 'equalto', 'Running')
         | selectattr('ipv4', 'truthy') | list }}

- name: Require all four lab instances
  ansible.builtin.assert:
    that: inv_nodes | length == lab_nodes | length or allow_partial | default(false) | bool
    fail_msg: >-
      Expected {{ lab_nodes | join(', ') }} running; found
      {{ inv_nodes | map(attribute='name') | join(', ') or 'none' }}.
      Run 'make provision' (or pass -e allow_partial=true for diagnostics).
    quiet: true

- name: Require the dedicated SSH trust material
  ansible.builtin.assert:
    that:
      - ssh_private_key is file
      - ssh_known_hosts is file
    fail_msg: Dedicated SSH material is missing; run 'make provision'.
    quiet: true

- name: Add the lab instances to the in-memory inventory
  ansible.builtin.add_host:
    name: "{{ item.name }}"
    groups: >-
      {{ ['red_pass', lab_service_nodes[item.name].group if item.name in lab_service_nodes
          else ('vault_seal' if item.name == lab_seal_node else 'vault')] }}
    ansible_host: "{{ item.ipv4[0] }}"
    ansible_user: "{{ lab_ssh_user }}"
    ansible_python_interpreter: "{{ lab_guest_python }}"
    ansible_ssh_private_key_file: "{{ ssh_private_key }}"
    ansible_ssh_common_args: >-
      -o StrictHostKeyChecking=yes -o UserKnownHostsFile={{ ssh_known_hosts }}
  loop: "{{ inv_nodes }}"
  loop_control:
    label: "{{ item.name }}"
  changed_when: false
