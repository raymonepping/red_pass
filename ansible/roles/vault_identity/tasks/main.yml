---
# Vault trusts people: auth/oidc (Keycloak browser/CLI flow), auth/jwt
# (Keycloak tokens presented directly — a mount with oidc_client_id refuses
# JWT logins) and auth/ldap (directory), with
# external identity groups carrying the person policies. Platform token only;
# every write is preceded by a read so reruns report `ok`.

- name: Address the cluster and bind the identity secrets
  ansible.builtin.set_fact:
    vid_addr: "https://{{ hostvars[vault_leader].ansible_host }}:{{ vault_api_port }}"
    vid_ca_pem: "{{ lookup('file', vault_ca_cert) }}"
  no_log: true

- name: Configure Vault identity
  module_defaults:
    ansible.builtin.uri:
      ca_path: "{{ vault_ca_cert }}"
      headers:
        X-Vault-Token: "{{ lookup('file', platform_token_path) | trim }}"
  no_log: true
  block:
    # ── Policies ──────────────────────────────────────────────────────────────
    - name: Read the person policies
      ansible.builtin.uri:
        url: "{{ vid_addr }}/v1/sys/policies/acl/{{ item }}"
        status_code: [200, 404]
      check_mode: false
      loop: [red-pass-admin, red-pass-operator, red-pass-viewer]
      register: vid_policies

    - name: Write person policies that differ
      ansible.builtin.uri:
        url: "{{ vid_addr }}/v1/sys/policies/acl/{{ item.item }}"
        method: PUT
        body_format: json
        body: { policy: "{{ lookup('file', repo_root ~ '/policies/' ~ item.item ~ '.hcl') }}" }
        status_code: [200, 204]
      changed_when: true
      loop: "{{ vid_policies.results }}"
      loop_control:
        label: "{{ item.item }}"
      when: >-
        item.status == 404 or
        (item.json.data.policy | trim) != (lookup('file', repo_root ~ '/policies/' ~ item.item ~ '.hcl') | trim)

    # ── Auth methods ──────────────────────────────────────────────────────────
    - name: Read enabled auth methods
      ansible.builtin.uri:
        url: "{{ vid_addr }}/v1/sys/auth"
      check_mode: false
      register: vid_auth

    - name: Enable oidc, jwt and ldap auth
      ansible.builtin.uri:
        url: "{{ vid_addr }}/v1/sys/auth/{{ item }}"
        method: POST
        body_format: json
        body: { type: "{{ item }}", description: "red_pass people ({{ item }})" }
        status_code: [200, 204]
      changed_when: true
      loop: [oidc, jwt, ldap]
      when: (item ~ '/') not in vid_auth.json.data

    - name: Re-read auth methods for their accessors
      ansible.builtin.uri:
        url: "{{ vid_addr }}/v1/sys/auth"
      check_mode: false
      register: vid_auth

    - name: Remember the mount accessors
      ansible.builtin.set_fact:
        vid_accessor:
          oidc: "{{ vid_auth.json.data['oidc/'].accessor | default('') }}"
          jwt: "{{ vid_auth.json.data['jwt/'].accessor | default('') }}"
          ldap: "{{ vid_auth.json.data['ldap/'].accessor | default('') }}"

    # ── OIDC (Keycloak) ───────────────────────────────────────────────────────
    - name: Read the OIDC config
      ansible.builtin.uri:
        url: "{{ vid_addr }}/v1/auth/oidc/config"
        status_code: [200, 404]
      check_mode: false
      register: vid_oidc_cfg

    - name: Write the OIDC config when it differs
      ansible.builtin.uri:
        url: "{{ vid_addr }}/v1/auth/oidc/config"
        method: POST
        body_format: json
        body:
          oidc_discovery_url: "{{ keycloak_issuer }}"
          oidc_discovery_ca_pem: "{{ vid_ca_pem }}"
          oidc_client_id: vault
          oidc_client_secret: "{{ hostvars['localhost'].identity_secrets.vault_client_secret }}"
          default_role: default
        status_code: [200, 204]
      changed_when: true
      when: >-
        vid_oidc_cfg.status == 404 or
        vid_oidc_cfg.json.data.oidc_discovery_url != keycloak_issuer or
        vid_oidc_cfg.json.data.oidc_client_id != 'vault' or
        vid_oidc_cfg.json.data.default_role != 'default' or
        (vid_oidc_cfg.json.data.oidc_discovery_ca_pem | trim) != (vid_ca_pem | trim) or
        vid_force_oidc_secret | default(false) | bool

    - name: Desired roles (mount/role)
      ansible.builtin.set_fact:
        vid_roles:
          oidc/default:
            role_type: oidc
            user_claim: preferred_username
            groups_claim: groups
            bound_audiences: [vault]
            oidc_scopes: [openid, profile, email]
            allowed_redirect_uris: "{{ vault_oidc_redirect_uris }}"
            token_ttl: 3600
            token_max_ttl: 14400
          # Lab only: Keycloak id_tokens from red-pass-cli (gate tests).
          jwt/cli:
            role_type: jwt
            user_claim: preferred_username
            groups_claim: groups
            bound_audiences: [red-pass-cli]
            token_ttl: 900
            token_max_ttl: 900

    - name: Read the JWT config
      ansible.builtin.uri:
        url: "{{ vid_addr }}/v1/auth/jwt/config"
        status_code: [200, 404]
      check_mode: false
      register: vid_jwt_cfg

    - name: Write the JWT config (discovery only) when it differs
      ansible.builtin.uri:
        url: "{{ vid_addr }}/v1/auth/jwt/config"
        method: POST
        body_format: json
        body:
          oidc_discovery_url: "{{ keycloak_issuer }}"
          oidc_discovery_ca_pem: "{{ vid_ca_pem }}"
          bound_issuer: "{{ keycloak_issuer }}"
          default_role: cli
        status_code: [200, 204]
      changed_when: true
      when: >-
        vid_jwt_cfg.status == 404 or
        vid_jwt_cfg.json.data.oidc_discovery_url != keycloak_issuer or
        vid_jwt_cfg.json.data.bound_issuer != keycloak_issuer or
        (vid_jwt_cfg.json.data.oidc_discovery_ca_pem | trim) != (vid_ca_pem | trim)

    - name: Read the roles
      ansible.builtin.uri:
        url: "{{ vid_addr }}/v1/auth/{{ item.split('/')[0] }}/role/{{ item.split('/')[1] }}"
        status_code: [200, 404]
      check_mode: false
      loop: "{{ vid_roles.keys() | list }}"
      register: vid_role_reads

    - name: Write roles that differ
      ansible.builtin.uri:
        url: "{{ vid_addr }}/v1/auth/{{ item.item.split('/')[0] }}/role/{{ item.item.split('/')[1] }}"
        method: POST
        body_format: json
        body: "{{ vid_roles[item.item] }}"
        status_code: [200, 204]
      changed_when: true
      loop: "{{ vid_role_reads.results }}"
      loop_control:
        label: "{{ item.item }}"
      when: >-
        item.status == 404 or
        vid_roles[item.item].user_claim != item.json.data.user_claim or
        vid_roles[item.item].groups_claim != item.json.data.groups_claim or
        (vid_roles[item.item].bound_audiences | sort) != (item.json.data.bound_audiences | default([], true) | sort) or
        ((vid_roles[item.item].allowed_redirect_uris | default([])) | sort) != ((item.json.data.allowed_redirect_uris | default([], true)) | sort) or
        vid_roles[item.item].role_type != item.json.data.role_type

    - name: Check for the obsolete JWT role on the OIDC mount
      ansible.builtin.uri:
        url: "{{ vid_addr }}/v1/auth/oidc/role/cli"
        status_code: [200, 404]
      check_mode: false
      register: vid_stale_cli

    - name: Remove the obsolete JWT role from the OIDC mount
      ansible.builtin.uri:
        url: "{{ vid_addr }}/v1/auth/oidc/role/cli"
        method: DELETE
        status_code: [200, 204]
      changed_when: true
      when: vid_stale_cli.status == 200

    # ── LDAP ──────────────────────────────────────────────────────────────────
    - name: Read the LDAP config
      ansible.builtin.uri:
        url: "{{ vid_addr }}/v1/auth/ldap/config"
      check_mode: false
      register: vid_ldap_cfg

    - name: Desired LDAP config
      ansible.builtin.set_fact:
        vid_ldap:
          url: "{{ ldaps_url }}"
          certificate: "{{ vid_ca_pem }}"
          insecure_tls: false
          starttls: false
          binddn: "cn=readonly,{{ identity_base_dn }}"
          userdn: "ou=people,{{ identity_base_dn }}"
          userattr: uid
          groupdn: "ou=groups,{{ identity_base_dn }}"
          groupfilter: "(&(objectClass=groupOfNames)(member={{ '{{' }}.UserDN{{ '}}' }}))"
          groupattr: cn
          token_ttl: 3600
          token_max_ttl: 14400

    - name: Write the LDAP config when it differs
      ansible.builtin.uri:
        url: "{{ vid_addr }}/v1/auth/ldap/config"
        method: POST
        body_format: json
        body: "{{ vid_ldap | combine({'bindpass': hostvars['localhost'].identity_secrets.ldap_readonly_password}) }}"
        status_code: [200, 204]
      changed_when: true
      when: >-
        vid_ldap_cfg.json.data.url != vid_ldap.url or
        vid_ldap_cfg.json.data.binddn != vid_ldap.binddn or
        vid_ldap_cfg.json.data.userdn != vid_ldap.userdn or
        vid_ldap_cfg.json.data.groupdn != vid_ldap.groupdn or
        vid_ldap_cfg.json.data.groupfilter != vid_ldap.groupfilter or
        (vid_ldap_cfg.json.data.certificate | default('') | trim) != (vid_ca_pem | trim)

    # ── External groups: one per (mount, directory group) ────────────────────
    - name: Read the external groups
      ansible.builtin.uri:
        url: "{{ vid_addr }}/v1/identity/group/name/{{ item.0 }}-{{ item.1.key }}"
        status_code: [200, 404]
      check_mode: false
      loop: "{{ ['oidc', 'jwt', 'ldap'] | product(identity_groups | dict2items) | list }}"
      loop_control:
        label: "{{ item.0 }}-{{ item.1.key }}"
      register: vid_groups

    - name: Create or correct external groups
      ansible.builtin.uri:
        url: "{{ vid_addr }}/v1/identity/group/name/{{ item.item.0 }}-{{ item.item.1.key }}"
        method: POST
        body_format: json
        body: { type: external, policies: ["{{ item.item.1.value.policy }}"], metadata: { source: red_pass } }
        status_code: [200, 204]
      changed_when: true
      loop: "{{ vid_groups.results }}"
      loop_control:
        label: "{{ item.item.0 }}-{{ item.item.1.key }}"
      when: item.status == 404 or item.json.data.policies != [item.item.1.value.policy]

    - name: Re-read the external groups for their ids and aliases
      ansible.builtin.uri:
        url: "{{ vid_addr }}/v1/identity/group/name/{{ item.0 }}-{{ item.1.key }}"
      check_mode: false
      loop: "{{ ['oidc', 'jwt', 'ldap'] | product(identity_groups | dict2items) | list }}"
      loop_control:
        label: "{{ item.0 }}-{{ item.1.key }}"
      register: vid_groups

    - name: Alias each external group to its directory group
      ansible.builtin.uri:
        url: "{{ vid_addr }}/v1/identity/group-alias"
        method: POST
        body_format: json
        body:
          name: "{{ item.item.1.key }}"
          mount_accessor: "{{ vid_accessor[item.item.0] }}"
          canonical_id: "{{ item.json.data.id }}"
        status_code: [200, 204]
      changed_when: true
      loop: "{{ vid_groups.results }}"
      loop_control:
        label: "{{ item.item.0 }}-{{ item.item.1.key }}"
      when: (item.json.data.alias | default({}, true)).name | default('') != item.item.1.key
