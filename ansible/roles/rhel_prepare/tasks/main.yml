---
# RHEL validation, DNS repair, RHSM registration and firewalld.
# Ported from multi_pass; credentials come only from the controller
# environment through no_log tasks.

- name: Require RHEL 9 on ARM64 with SELinux enforcing
  ansible.builtin.assert:
    that:
      - ansible_facts['architecture'] == 'aarch64'
      - ansible_facts['distribution'] == 'RedHat'
      - ansible_facts['distribution_major_version'] == '9'
      - ansible_facts['selinux']['status'] == 'enabled'
      - ansible_facts['selinux']['mode'] == 'enforcing'
    fail_msg: "{{ inventory_hostname }} must be RHEL 9 ARM64 with SELinux enforcing."
    quiet: true

- name: Check whether firewalld is installed
  ansible.builtin.stat:
    path: /usr/bin/firewall-cmd
  register: rhel_firewall_cmd

- name: Prepare RHEL package access when firewalld is absent
  when: not rhel_firewall_cmd.stat.exists
  block:
    - name: Test Red Hat endpoint resolution
      ansible.builtin.command:
        argv: [getent, ahosts, subscription.rhsm.redhat.com]
      register: rhel_rhsm_dns
      changed_when: false
      failed_when: false

    - name: Repair a DNS-only Multipass failure through NetworkManager
      when: rhel_rhsm_dns.rc != 0
      block:
        - name: Verify raw HTTPS connectivity before changing DNS
          ansible.builtin.command:
            argv: [curl, -kfsS, --connect-timeout, "5", --max-time, "10", -o, /dev/null, https://1.1.1.1/]
          changed_when: false

        - name: Read the active NetworkManager connection
          ansible.builtin.command:
            argv: [nmcli, -g, GENERAL.CONNECTION, device, show, eth0]
          register: rhel_nm_connection
          changed_when: false

        - name: Configure the fallback resolvers
          ansible.builtin.command:
            argv:
              - nmcli
              - connection
              - modify
              - "{{ rhel_nm_connection.stdout }}"
              - ipv4.ignore-auto-dns
              - "yes"
              - ipv4.dns
              - "{{ lookup('env', 'RHEL_DNS_SERVERS') | default('1.1.1.1,1.0.0.1', true) }}"
          changed_when: true

        - name: Reapply the NetworkManager connection
          ansible.builtin.command:
            argv: [nmcli, device, reapply, eth0]
          changed_when: true

        - name: Require Red Hat endpoint resolution after repair
          ansible.builtin.command:
            argv: [getent, ahosts, subscription.rhsm.redhat.com]
          register: rhel_rhsm_dns_repaired
          changed_when: false
          retries: 10
          delay: 1
          until: rhel_rhsm_dns_repaired.rc == 0

    - name: Check Red Hat registration
      ansible.builtin.command:
        argv: [subscription-manager, identity]
      register: rhel_rhsm_identity
      changed_when: false
      failed_when: false

    - name: Require activation-key inputs for an unregistered guest
      ansible.builtin.assert:
        that:
          - lookup('env', 'RHSM_ORG') | length > 0
          - lookup('env', 'RHSM_ACTIVATION_KEY') | length > 0
        fail_msg: RHEL registration is required; set RHSM_ORG and RHSM_ACTIVATION_KEY in .env.
        quiet: true
      no_log: true
      when: rhel_rhsm_identity.rc != 0

    - name: Register with Red Hat using the activation key
      ansible.builtin.command:
        argv:
          - subscription-manager
          - register
          - "--org={{ lookup('env', 'RHSM_ORG') }}"
          - "--activationkey={{ lookup('env', 'RHSM_ACTIVATION_KEY') }}"
          - --name={{ inventory_hostname }}
      register: rhel_rhsm_register
      changed_when: true
      no_log: true
      when: rhel_rhsm_identity.rc != 0

    - name: Require an enabled RHEL repository
      ansible.builtin.command:
        argv: [dnf, -q, repolist, --enabled]
      register: rhel_repos
      changed_when: false
      failed_when: rhel_repos.rc != 0 or rhel_repos.stdout | trim | length == 0

    - name: Install firewalld from the enabled RHEL repositories
      ansible.builtin.dnf:
        name: firewalld
        state: present

- name: Enable and start firewalld
  ansible.builtin.systemd_service:
    name: firewalld
    state: started
    enabled: true
