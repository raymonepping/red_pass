---
# Vault configuration and the hardened systemd unit. Cluster nodes get the
# transit seal stanza, raft retry_join and the seal-wait guard; the seal
# Vault is a standalone single-node raft cluster.

- name: Require TLS material and the license on the node
  ansible.builtin.stat:
    path: "{{ item }}"
  loop:
    - "{{ vault_tls_dir }}/ca.crt"
    - "{{ vault_tls_dir }}/server.crt"
    - "{{ vault_license_dest }}"
  register: vault_prereq
  failed_when: not vault_prereq.stat.exists

- name: Remove single-line peer entries from earlier runs
  ansible.builtin.lineinfile:
    path: /etc/hosts
    regexp: "# red-pass$"
    state: absent

# Multipass vendor-data sets manage_etc_hosts: true, so cloud-init rewrites
# /etc/hosts from this template on every boot. Manage both.
- name: Resolve every lab node by name (now and after every reboot)
  ansible.builtin.blockinfile:
    path: "{{ item }}"
    marker: "# {mark} red-pass peers (managed by Ansible)"
    block: |
      {% for node in groups['red_pass'] | sort %}
      {{ hostvars[node].ansible_host }} {{ node }}
      {% endfor %}
  loop:
    - /etc/hosts
    - /etc/cloud/templates/hosts.redhat.tmpl

- name: Render vault.hcl
  ansible.builtin.template:
    src: vault.hcl.j2
    dest: "{{ vault_config_file }}"
    owner: root
    group: vault
    mode: "0640"
  notify: Restart vault

- name: Install the seal-wait guard
  ansible.builtin.template:
    src: vault-wait-seal.j2
    dest: /usr/local/bin/vault-wait-seal
    owner: root
    group: root
    mode: "0755"
  when: inventory_hostname in groups['vault']

- name: Install the hardened systemd unit
  ansible.builtin.template:
    src: vault.service.j2
    dest: /etc/systemd/system/vault.service
    owner: root
    group: root
    mode: "0644"
  notify: Restart vault

- name: Distribute the transit seal token
  ansible.builtin.include_tasks: seal_env.yml
  when: inventory_hostname in groups['vault']

- name: Decide whether the service may start
  ansible.builtin.set_fact:
    vault_may_start: >-
      {{ inventory_hostname == lab_seal_node or vault_seal_env.stat.exists | default(false) }}

- name: Enable and start Vault
  ansible.builtin.systemd_service:
    name: vault
    state: started
    enabled: true
    daemon_reload: true
  when: vault_may_start | bool

- name: Report cluster nodes waiting for the seal token
  ansible.builtin.debug:
    msg: "{{ inventory_hostname }} waits for bootstrap.yml to create the seal token before starting."
  when: not vault_may_start | bool
