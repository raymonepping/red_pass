---
# The console's read-only Vault token for the Engines page: a periodic orphan
# token with exactly one policy, issued through a token role the platform
# token may use (and nothing broader).
ux_engines_policy: red-pass-ui-engines
ux_engines_token_role: red-pass-ui-engines
ux_engines_token_period: 720h
ux_engines_token_period_seconds: 2592000
ux_engines_token_min_ttl_seconds: 259200   # renew below 72h
# Same namespace as vault_engines (engines_namespace) and the policy file.
ux_engines_namespace: engines
ux_engines_token_path: "{{ secrets_dir }}/ux/engines-token"
# Reads may be served by any unsealed node: the front door's reads port.
ux_engines_vault_addr: "{{ front_door_url }}:{{ proxy_ports.vault_reads }}"
