---
# Phase C — the transit-auto-unsealed cluster: init once with recovery
# keys, confirm every node unsealed itself and joined, then the platform
# policy and token. Runs on localhost; secrets are no_log throughout.

- name: Address the cluster nodes
  ansible.builtin.set_fact:
    leader_addr: "https://{{ hostvars[vault_leader].ansible_host }}:{{ vault_api_port }}"
    cluster_followers: "{{ groups['vault'] | difference([vault_leader]) | sort }}"

- name: Wait for the leader API
  ansible.builtin.uri:
    url: "{{ leader_addr }}/v1/sys/seal-status"
    ca_path: "{{ vault_ca_cert }}"
  check_mode: false
  register: leader_status
  until: leader_status.status == 200
  retries: 60
  delay: 3

- name: Check for controller cluster initialisation material
  ansible.builtin.stat:
    path: "{{ vault_init_path }}"
  register: vault_init_file

- name: Protect an initialised cluster from lost material
  ansible.builtin.assert:
    that: leader_status.json.initialized == vault_init_file.stat.exists
    fail_msg: >-
      The cluster initialised={{ leader_status.json.initialized }} but
      {{ vault_init_path }} exists={{ vault_init_file.stat.exists }}. Restore the
      correct file; it is never overwritten and Vault is never reinitialised.
    quiet: true

- name: Require the transit seal on the leader
  ansible.builtin.assert:
    that: leader_status.json.type == 'transit'
    fail_msg: "{{ vault_leader }} reports seal type {{ leader_status.json.type }}, expected transit."
    quiet: true

- name: Initialise the cluster exactly once
  when: not leader_status.json.initialized
  no_log: true
  block:
    - name: Initialise the cluster (recovery {{ recovery_shares }}/{{ recovery_threshold }})
      ansible.builtin.uri:
        url: "{{ leader_addr }}/v1/sys/init"
        ca_path: "{{ vault_ca_cert }}"
        method: PUT
        body_format: json
        body:
          recovery_shares: "{{ recovery_shares | int }}"
          recovery_threshold: "{{ recovery_threshold | int }}"
      register: vault_init_result
      changed_when: true

    - name: Persist the cluster initialisation material
      ansible.builtin.copy:
        content: "{{ vault_init_result.json | to_nice_json }}\n"
        dest: "{{ vault_init_path }}"
        mode: "0600"
      diff: false

- name: Load the cluster initialisation material
  ansible.builtin.set_fact:
    vault_init: "{{ lookup('file', vault_init_path) | from_json }}"
  no_log: true
  when: not ansible_check_mode or vault_init_file.stat.exists

- name: Wait for the leader to auto-unseal
  ansible.builtin.uri:
    url: "{{ leader_addr }}/v1/sys/seal-status"
    ca_path: "{{ vault_ca_cert }}"
  check_mode: false
  register: leader_unsealed
  until: leader_unsealed.json.initialized | default(false) and not leader_unsealed.json.sealed
  retries: 40
  delay: 3

- name: Give followers time to auto-join through retry_join
  ansible.builtin.uri:
    url: "https://{{ hostvars[item].ansible_host }}:{{ vault_api_port }}/v1/sys/seal-status"
    ca_path: "{{ vault_ca_cert }}"
  check_mode: false
  loop: "{{ cluster_followers }}"
  register: follower_status
  until: follower_status.json.initialized | default(false) and not follower_status.json.sealed
  retries: 30
  delay: 3
  failed_when: false

- name: Join a follower explicitly when retry_join has not (fallback)
  ansible.builtin.uri:
    url: "https://{{ hostvars[item.item].ansible_host }}:{{ vault_api_port }}/v1/sys/storage/raft/join"
    ca_path: "{{ vault_ca_cert }}"
    method: POST
    body_format: json
    body:
      leader_api_addr: "https://{{ vault_leader }}:{{ vault_api_port }}"
      leader_ca_cert: "{{ lookup('file', vault_ca_cert) }}"
  loop: "{{ follower_status.results }}"
  loop_control:
    label: "{{ item.item }}"
  changed_when: true
  when: not (item.json.initialized | default(false))

- name: Require every follower initialised and auto-unsealed
  ansible.builtin.uri:
    url: "https://{{ hostvars[item].ansible_host }}:{{ vault_api_port }}/v1/sys/seal-status"
    ca_path: "{{ vault_ca_cert }}"
  check_mode: false
  loop: "{{ cluster_followers }}"
  register: follower_ready
  until: follower_ready.json.initialized | default(false) and not follower_ready.json.sealed
  retries: 40
  delay: 3

- name: Configure the platform policy and token
  when: vault_init is defined
  module_defaults:
    ansible.builtin.uri:
      ca_path: "{{ vault_ca_cert }}"
  no_log: true
  block:
    - name: Read the platform policy
      ansible.builtin.uri:
        url: "{{ leader_addr }}/v1/sys/policies/acl/{{ platform_policy_name }}"
        headers: { X-Vault-Token: "{{ vault_init.root_token }}" }
        status_code: [200, 404]
      check_mode: false
      register: platform_policy

    - name: Write the platform policy when it differs
      ansible.builtin.uri:
        url: "{{ leader_addr }}/v1/sys/policies/acl/{{ platform_policy_name }}"
        headers: { X-Vault-Token: "{{ vault_init.root_token }}" }
        method: PUT
        body_format: json
        body: { policy: "{{ lookup('file', repo_root ~ '/policies/platform-admin.hcl') }}" }
        status_code: [200, 204]
      changed_when: true
      when: >-
        platform_policy.status == 404 or
        (platform_policy.json.data.policy | trim)
        != (lookup('file', repo_root ~ '/policies/platform-admin.hcl') | trim)

    - name: Check for an existing platform token
      ansible.builtin.stat:
        path: "{{ platform_token_path }}"
      register: platform_token_file

    - name: Validate the existing platform token
      ansible.builtin.uri:
        url: "{{ leader_addr }}/v1/auth/token/lookup-self"
        headers: { X-Vault-Token: "{{ lookup('file', platform_token_path) | trim }}" }
        status_code: [200, 403]
      check_mode: false
      register: platform_token_check
      when: platform_token_file.stat.exists

    - name: Create the periodic orphan platform token
      ansible.builtin.uri:
        url: "{{ leader_addr }}/v1/auth/token/create-orphan"
        headers: { X-Vault-Token: "{{ vault_init.root_token }}" }
        method: POST
        body_format: json
        body:
          policies: ["{{ platform_policy_name }}"]
          period: "{{ platform_token_period }}"
          display_name: red-pass-platform-admin
      register: platform_new_token
      changed_when: true
      when: not platform_token_file.stat.exists or platform_token_check.status == 403

    - name: Persist the platform token
      ansible.builtin.copy:
        content: "{{ platform_new_token.json.auth.client_token }}\n"
        dest: "{{ platform_token_path }}"
        mode: "0600"
      diff: false
      when: platform_new_token is not skipped

    - name: Renew the platform token (maintenance, not a configuration change)
      ansible.builtin.uri:
        url: "{{ leader_addr }}/v1/auth/token/renew-self"
        headers: { X-Vault-Token: "{{ lookup('file', platform_token_path) | trim }}" }
        method: POST
      changed_when: false
      when:
        - platform_token_check.status | default(0) == 200
        - not ansible_check_mode

    - name: Read the Raft configuration
      ansible.builtin.uri:
        url: "{{ leader_addr }}/v1/sys/storage/raft/configuration"
        headers: { X-Vault-Token: "{{ vault_init.root_token }}" }
      check_mode: false
      register: raft_configuration
      # Autopilot promotes new peers to voters after a short stabilisation.
      until: >-
        raft_configuration.json.data.config.servers
        | selectattr('voter', 'equalto', true) | list | length == groups['vault'] | length
      retries: 20
      delay: 3

- name: Require three Raft voters
  ansible.builtin.assert:
    that: >-
      raft_configuration.json.data.config.servers
      | selectattr('voter', 'equalto', true) | list | length == groups['vault'] | length
    fail_msg: The cluster does not have {{ groups['vault'] | length }} Raft voters.
    quiet: true
  when: raft_configuration is not skipped
