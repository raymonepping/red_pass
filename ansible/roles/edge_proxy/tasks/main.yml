---
# HAProxy front door on red-proxy-1: TLS in, verified TLS out, backends from
# the inventory, stats password from Vault KV (stored hashed in the config).

- name: Read or create the stats password in Vault KV
  delegate_to: localhost
  become: false
  run_once: true
  no_log: true
  module_defaults:
    ansible.builtin.uri:
      ca_path: "{{ vault_ca_cert }}"
      headers:
        X-Vault-Token: "{{ lookup('file', platform_token_path) | trim }}"
  block:
    - name: Read the proxy secret
      ansible.builtin.uri:
        url: "https://{{ hostvars[vault_leader].ansible_host }}:{{ vault_api_port }}/v1/{{ identity_kv_mount }}/data/{{ proxy_kv_path }}"
        status_code: [200, 404]
      check_mode: false
      register: proxy_kv

    - name: Store a new stats password
      ansible.builtin.uri:
        url: "https://{{ hostvars[vault_leader].ansible_host }}:{{ vault_api_port }}/v1/{{ identity_kv_mount }}/data/{{ proxy_kv_path }}"
        method: POST
        body_format: json
        body: { data: { stats_password: "{{ proxy_new_password }}" } }
        status_code: [200, 204]
      vars:
        proxy_new_password: "{{ lookup('ansible.builtin.password', '/dev/null', length=32, chars=['ascii_letters', 'digits']) }}"
      changed_when: true
      register: proxy_kv_write
      when: proxy_kv.status == 404

    - name: Re-read the proxy secret
      ansible.builtin.uri:
        url: "https://{{ hostvars[vault_leader].ansible_host }}:{{ vault_api_port }}/v1/{{ identity_kv_mount }}/data/{{ proxy_kv_path }}"
      check_mode: false
      register: proxy_kv

- name: Hash the stats password (deterministic salt keeps reruns ok)
  ansible.builtin.set_fact:
    proxy_stats_hash: >-
      {{ proxy_kv.json.data.data.stats_password
         | password_hash('sha512', ('red-pass-' ~ inventory_hostname) | hash('sha1') | truncate(16, true, ''), rounds=5000) }}
  no_log: true

- name: Install HAProxy
  ansible.builtin.dnf:
    name: haproxy
    state: present

- name: Let HAProxy bind and connect to the lab ports (SELinux stays enforcing)
  ansible.posix.seboolean:
    name: haproxy_connect_any
    state: true
    persistent: true

- name: Create the front-door directory
  ansible.builtin.file:
    path: "{{ proxy_dir }}"
    state: directory
    owner: root
    group: haproxy
    mode: "0750"

- name: Issue the front-door certificate (names, IP, 127.0.0.1)
  ansible.builtin.include_role:
    name: vault_tls
    tasks_from: issue.yml
  vars:
    tls_extra_dns_names: "{{ proxy_names }}"

- name: Trust the lab CA on the node
  ansible.builtin.include_role:
    name: vault_tls
    tasks_from: anchor.yml

- name: Install the lab CA for backend verification
  ansible.builtin.copy:
    src: "{{ tls_dir }}/ca.crt"
    dest: "{{ proxy_dir }}/ca.crt"
    owner: root
    group: haproxy
    mode: "0644"
  notify: Reload haproxy

- name: Install the certificate bundle (cert + key, contents suppressed)
  ansible.builtin.copy:
    content: "{{ lookup('file', tls_dir ~ '/' ~ inventory_hostname ~ '.crt') }}\n{{ lookup('file', tls_dir ~ '/' ~ inventory_hostname ~ '.key') }}\n"
    dest: "{{ proxy_dir }}/front-door.pem"
    owner: root
    group: haproxy
    mode: "0640"
  no_log: true
  diff: false
  notify: Reload haproxy

- name: Render and validate haproxy.cfg
  ansible.builtin.template:
    src: haproxy.cfg.j2
    dest: /etc/haproxy/haproxy.cfg
    owner: root
    group: haproxy
    mode: "0640"
    validate: haproxy -c -f %s
  no_log: true
  diff: false
  notify: Reload haproxy

- name: Open the front-door ports
  ansible.posix.firewalld:
    port: "{{ item }}/tcp"
    permanent: true
    immediate: true
    state: enabled
  loop: "{{ proxy_ports.values() | list }}"

- name: Enable and start HAProxy
  ansible.builtin.systemd_service:
    name: haproxy
    state: started
    enabled: true
