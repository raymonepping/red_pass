---
# Open fw_port/tcp either to everyone (fw_sources empty) or only to the given
# source addresses (firewalld rich rules), removing the other form.
# vars: fw_port (int), fw_sources (list of IPv4 addresses)

- name: "Port {{ fw_port }}: open to everyone"
  ansible.posix.firewalld:
    port: "{{ fw_port }}/tcp"
    permanent: true
    immediate: true
    state: "{{ 'enabled' if fw_sources | length == 0 else 'disabled' }}"

- name: "Port {{ fw_port }}: allow only the listed sources"
  ansible.posix.firewalld:
    rich_rule: 'rule family="ipv4" source address="{{ item }}/32" port port="{{ fw_port }}" protocol="tcp" accept'
    permanent: true
    immediate: true
    state: enabled
  loop: "{{ fw_sources }}"
