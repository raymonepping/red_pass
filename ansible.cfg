[defaults]
inventory              = ansible/inventory/localhost.yml
roles_path             = ansible/roles
collections_path       = .cache/ansible/collections
local_tmp              = .cache/ansible/tmp
host_key_checking      = True
stdout_callback        = ansible.builtin.default
result_format          = yaml
callbacks_enabled      = ansible.posix.profile_tasks
retry_files_enabled    = False
# Never persist facts: they could carry environment-derived values.
fact_caching           = memory

[privilege_escalation]
become        = False
become_method = sudo

[ssh_connection]
pipelining = True
# The inventory supplies a dedicated identity and known_hosts file. Bypass the
# user's SSH config so macOS-only settings (UseKeychain) cannot break runs.
ssh_args   = -F /dev/null -o IdentitiesOnly=yes -o ControlMaster=auto -o ControlPersist=60s
